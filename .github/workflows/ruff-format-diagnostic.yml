name: Ruff format diagnostic

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diff:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync
      - name: Show Ruff formatting diff
        shell: pwsh
        run: |
          uv run ruff format addon/globalPlugins/rdAccess/handlers/remoteAccessSemanticBraille.py tests/test_remoteAccessSemanticBraille.py addon/globalPlugins/rdAccess/handlers/remoteA11yHandler.py tests/test_remoteA11yObject.py
          git diff -- addon/globalPlugins/rdAccess/handlers/remoteAccessSemanticBraille.py tests/test_remoteAccessSemanticBraille.py addon/globalPlugins/rdAccess/handlers/remoteA11yHandler.py tests/test_remoteA11yObject.py
