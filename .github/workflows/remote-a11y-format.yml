name: Remote A11Y format diff

on:
  pull_request:
    paths:
      - ".github/workflows/remote-a11y-format.yml"
      - "addon/lib/a11y.py"
      - "addon/globalPlugins/rdAccess/handlers/remoteA11yHandler.py"
      - "tests/test_a11y.py"
      - "tests/remote_a11y_contract.py"

jobs:
  diff:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync
      - name: Show Ruff fixes and formatting diff
        shell: pwsh
        run: |
          $files = @(
            "addon/lib/a11y.py",
            "addon/globalPlugins/rdAccess/handlers/remoteA11yHandler.py",
            "tests/test_a11y.py",
            "tests/remote_a11y_contract.py"
          )
          uv run ruff check --fix @files
          uv run ruff format @files
          git diff -- @files
