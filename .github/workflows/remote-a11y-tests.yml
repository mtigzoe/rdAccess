name: Remote A11Y prototype tests

on:
  pull_request:
    paths:
      - "addon/lib/a11y.py"
      - "addon/globalPlugins/rdAccess/handlers/remoteA11yHandler.py"
      - "tests/test_a11y.py"
      - ".github/workflows/remote-a11y-tests.yml"
  push:
    branches:
      - "feature/remote-a11y-objects"
    paths:
      - "addon/lib/a11y.py"
      - "tests/test_a11y.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run semantic protocol unit tests
        env:
          PYTHONPATH: addon
        run: |
          python tests/test_a11y.py -v
