name: Remote A11Y prototype tests

on:
  pull_request:
    paths:
      - "addon/lib/a11y.py"
      - "addon/globalPlugins/rdAccess/handlers/remoteA11yHandler.py"
      - "tests/test_a11y.py"
      - "tests/remote_a11y_contract.py"
      - ".github/workflows/remote-a11y-tests.yml"
  push:
    branches:
      - "feature/remote-a11y-objects"
      - "feature/remote-a11y-navigation"
      - "feature/remote-a11y-actions"
      - "feature/remote-a11y-heartbeat"
      - "feature/remote-a11y-text"
    paths:
      - "addon/lib/a11y.py"
      - "addon/globalPlugins/rdAccess/handlers/remoteA11yHandler.py"
      - "tests/test_a11y.py"
      - "tests/remote_a11y_contract.py"
      - ".github/workflows/remote-a11y-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rdAccess
        uses: actions/checkout@v4
      - name: Checkout Linux producer
        uses: actions/checkout@v4
        with:
          repository: mtigzoe/linux-rdaccess
          ref: main
          path: linux-rdaccess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run semantic protocol unit tests
        env:
          PYTHONPATH: addon
        run: |
          python tests/test_a11y.py -v
      - name: Generate Linux semantic fixtures
        run: |
          cd linux-rdaccess
          python tools/generate_remote_a11y_fixture.py > ../linux-a11y-fixture.json
          python tools/generate_remote_a11y_role_matrix.py > ../linux-a11y-role-matrix.json
          python tools/generate_remote_a11y_state_matrix.py > ../linux-a11y-state-matrix.json
          python tools/generate_remote_a11y_navigation_fixture.py > ../linux-a11y-navigation.json
          python tools/generate_remote_a11y_action_fixture.py > ../linux-a11y-action.json
          python tools/generate_remote_a11y_text_fixture.py > ../linux-a11y-text.json
      - name: Verify Linux to rdAccess semantic contract
        run: |
          python tests/remote_a11y_contract.py linux-a11y-fixture.json linux-a11y-role-matrix.json linux-a11y-state-matrix.json linux-a11y-navigation.json linux-a11y-action.json linux-a11y-text.json

      - name: Verify rdAccess action request is accepted by Linux
        shell: bash
        env:
          PYTHONPATH: addon
        run: |
          python - <<'PY' > rdaccess-action.json
          from lib.a11y import encodeActionRequest
          import sys
          sys.stdout.buffer.write(encodeActionRequest("remote-button", 1))
          PY
          python linux-rdaccess/tools/decode_remote_a11y_action.py < rdaccess-action.json > decoded-action.json
          python - <<'PY'
          import json
          with open("decoded-action.json", encoding="utf-8") as f:
              decoded = json.load(f)
          assert decoded == {"object_id": "remote-button", "action_index": 1}
          PY

      - name: Verify A11Y heartbeat contract
        shell: bash
        env:
          PYTHONPATH: addon
        run: |
          python - <<'PY' > rdaccess-pong.json
          from lib.a11y import decodeMessage, encodePong, PingMessage
          import sys
          msg = decodeMessage({"type": "a11y_ping", "nonce": 23})
          assert isinstance(msg, PingMessage)
          sys.stdout.buffer.write(encodePong(msg.nonce))
          PY
          PYTHONPATH=linux-rdaccess python - <<'PY'
          import json
          from a11y_link import decode_pong
          with open("rdaccess-pong.json", encoding="utf-8") as f:
              message = json.load(f)
          assert decode_pong(message) == 23
          PY
