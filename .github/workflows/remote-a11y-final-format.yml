name: Remote A11Y final format diff

on:
  pull_request:
    paths:
      - ".github/workflows/remote-a11y-final-format.yml"
      - "tests/remote_a11y_contract.py"
      - "tests/test_remoteA11yObject.py"
      - "tests/test_remoteA11yHandler.py"

jobs:
  diff:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Show Ruff format diff
        shell: pwsh
        run: |
          $files = @(
            "tests/remote_a11y_contract.py",
            "tests/test_remoteA11yObject.py",
            "tests/test_remoteA11yHandler.py"
          )
          uv run ruff format @files
          git diff -- @files
